name: keepalive

# Pings the live deployment every ~5 min so the free Render instance never
# sleeps (it spins down after 15 min idle, causing a ~60s cold start). Actions
# minutes are free on public repos; one always-on free service fits inside
# Render's ~750 instance-hours/month. Update DEPLOY_URL if the URL changes;
# delete this file to let the instance sleep again.
#
# Offset from round minutes (":03, :08, :13, ...") on purpose: GitHub delays
# or drops scheduled runs under load, and that load concentrates at round
# times (":00", ":10", ...). Measured drift on the old */10 schedule was
# ~30 min between actual runs — past Render's 15 min timeout, so cold starts
# kept happening despite this workflow. A tighter, offset interval leaves
# margin for the same delays without blowing past the timeout.

on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch: {}

env:
  DEPLOY_URL: https://docintel-dvze.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the service awake
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
              "$DEPLOY_URL/api/monitoring/metrics/" || echo 000)
            echo "ping $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "warning: service did not return 200 (may be mid-redeploy)"
